<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARキッチン配置</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/modelviewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }
    #ar-container { width: 100vw; height: 100vh; }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #e0e0e0;
    }
    .instruction {
      position: absolute;
      top: 30px;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
    .instruction p {
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px;
      border-radius: 8px;
      display: inline-block;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="instruction">
    <p>3Dモデルが表示されたら下部のボタンを押してください</p>
  </div>

  <div id="ar-container">
    <!-- 宇宙飛行士から、軽量な靴のモデルに変更しました -->
    <model-viewer 
      src="https://modelviewer.dev/shared-assets/models/Shoe.glb" 
      ios-src="https://modelviewer.dev/shared-assets/models/Shoe.usdz"
      alt="テスト用の3Dモデル" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      auto-rotate>
      
      <button slot="ar-button" style="background-color: #007bff; color: white; border: none; padding: 15px 30px; border-radius: 8px; position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
        部屋に配置する (AR)
      </button>

    </model-viewer>
  </div>

</body>
</html>
